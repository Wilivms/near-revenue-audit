name: tests
on:
  push:
  pull_request:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Rebuild from the committed snapshots; fail if any committed output changes
        run: make check-clean
