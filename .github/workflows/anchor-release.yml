name: anchor-release
# Writes the release hashes (frozen predictions, raw-snapshot manifest, live bundle) to NEAR mainnet with the
# function-call key in NEAR_MAINNET_KEY (it can only call `set` on social.near), then commits anchor/anchors.jsonl.
on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "what to anchor"
        default: "predictions snapshot daily"
permissions:
  contents: write
jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Anchor on NEAR mainnet and commit the log
        env:
          NEAR_MAINNET_KEY: ${{ secrets.NEAR_MAINNET_KEY }}
          KINDS: ${{ github.event.inputs.kinds }}
        run: |
          test -n "$NEAR_MAINNET_KEY" || { echo "NEAR_MAINNET_KEY secret is not set"; exit 1; }
          (cd anchor && npm ci --silent)
          for k in $KINDS; do NEAR_NETWORK=mainnet node anchor/anchor.mjs "$k"; done
          git config user.name "near-revenue-audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add anchor/anchors.jsonl
          git commit -m "Release anchor on NEAR mainnet: $KINDS (anchor/anchors.jsonl only)"
          git pull --rebase -X theirs origin main
          git push
