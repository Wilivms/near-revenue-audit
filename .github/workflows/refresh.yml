name: daily refresh
# Re-fetches the public sources, recomputes every offline step and commits the result as
# dashboard/live.json. The dashboard reads that file from GitHub, so it updates without a redeploy.
# With the INTENTS_JWT secret, it also updates the 1Click figures of the live bundle from a rolling 31-day window of
# swaps kept in this repository's private Actions cache (collected incrementally; never committed or published).
# Raw snapshots, dashboard/data.json and the documents stay frozen: they back REPORT.md, and `make check-clean`
# rebuilds data.json byte for byte from them.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Fetch fresh public data and recompute
        id: refresh
        # If NearBlocks cannot be reached, the revenue wallets keep their previous snapshot and the last days would read
        # as zero revenue: publish nothing that day (green, with a warning) and let the next scheduled run retry.
        run: |
          set -o pipefail
          status=0
          make refresh 2>&1 | tee "$RUNNER_TEMP/refresh.log" || status=$?
          if grep -qE "WARNING fetch_(buyback_txns|revenue_wallets) failed" "$RUNNER_TEMP/refresh.log"; then
            echo "::warning::NearBlocks was unreachable, so the revenue wallets could not be refreshed; nothing is published today and the next scheduled run retries."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Restore the rolling 31-day 1Click cache (private to this repository's Actions; never committed)
        if: steps.refresh.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: data/intents_v2
          key: oneclick-${{ github.run_id }}
          restore-keys: oneclick-
      - name: 1Click, last 31 days (partner key; per-swap data stays on the runner, only the bundle is kept)
        if: steps.refresh.outputs.publish == 'true'
        env:
          INTENTS_JWT: ${{ secrets.INTENTS_JWT }}
        run: |
          python3 -m src.analysis.oneclick_live
          make oneclick-offline dashboard
      - uses: actions/setup-node@v4
        if: steps.refresh.outputs.publish == 'true'
        with:
          node-version: "22"
      - name: Commit the live bundle only, and anchor it on NEAR testnet
        if: steps.refresh.outputs.publish == 'true'
        env:
          NEAR_TESTNET_KEY: ${{ secrets.NEAR_TESTNET_KEY }}
          NEAR_MAINNET_KEY: ${{ secrets.NEAR_MAINNET_KEY }}
        run: |
          cp dashboard/data.json "$RUNNER_TEMP/live.json"
          git checkout -- .
          git clean -fdq data
          cp "$RUNNER_TEMP/live.json" dashboard/live.json
          git config user.name "near-revenue-audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/live.json
          git diff --cached --quiet && exit 0
          if [ -n "$NEAR_TESTNET_KEY" ]; then (cd anchor && npm ci --silent) && node anchor/anchor.mjs daily && node anchor/anchor.mjs results && git add anchor/anchors.jsonl || echo "anchor failed; the bundle is still committed"; fi
          if [ -n "$NEAR_MAINNET_KEY" ]; then (cd anchor && npm ci --silent) && NEAR_NETWORK=mainnet node anchor/anchor.mjs daily && NEAR_NETWORK=mainnet node anchor/anchor.mjs results && git add anchor/anchors.jsonl || echo "mainnet anchor failed; the bundle is still committed"; fi
          git commit -m "Automated daily data refresh, $(date -u +%F): dashboard/live.json and its NEAR anchors only" -m "Scheduled GitHub Action (.github/workflows/refresh.yml). Re-fetches the public sources, recomputes the dashboard bundle and writes its sha256 to NEAR mainnet and testnet (anchor/anchors.jsonl). It changes no code, no analysis and no document; the submitted thesis is unchanged. This is how the dated predictions resolve in public."
          git pull --rebase -X theirs origin main
          git push
