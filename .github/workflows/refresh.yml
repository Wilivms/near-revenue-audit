name: daily refresh
# Re-fetches the public sources, recomputes every offline step and commits the result as
# dashboard/live.json. The dashboard reads that file from GitHub, so it updates without a redeploy.
# With the INTENTS_JWT secret, it also collects the last 31 days of 1Click swaps on the runner (never committed:
# the Explorer API's terms forbid redistribution) and updates the 1Click figures of the live bundle.
# Raw snapshots, dashboard/data.json and the documents stay frozen: they back REPORT.md, and `make check-clean`
# rebuilds data.json byte for byte from them.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Fetch fresh public data and recompute
        run: make refresh
      - name: 1Click, last 31 days (partner key; per-swap data stays on the runner, only the bundle is kept)
        env:
          INTENTS_JWT: ${{ secrets.INTENTS_JWT }}
        run: |
          python3 -m src.analysis.oneclick_live
          make oneclick-offline dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Commit the live bundle only, and anchor it on NEAR testnet
        env:
          NEAR_TESTNET_KEY: ${{ secrets.NEAR_TESTNET_KEY }}
        run: |
          cp dashboard/data.json "$RUNNER_TEMP/live.json"
          git checkout -- .
          git clean -fdq data
          cp "$RUNNER_TEMP/live.json" dashboard/live.json
          git config user.name "near-revenue-audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/live.json
          git diff --cached --quiet && exit 0
          if [ -n "$NEAR_TESTNET_KEY" ]; then (cd anchor && npm ci --silent) && node anchor/anchor.mjs daily && git add anchor/anchors.jsonl || echo "anchor failed; the bundle is still committed"; fi
          git commit -m "Automated daily data refresh, $(date -u +%F): dashboard/live.json and its NEAR testnet anchor only" -m "Scheduled GitHub Action (.github/workflows/refresh.yml). Re-fetches the public sources, recomputes the dashboard bundle and writes its sha256 to NEAR testnet (anchor/anchors.jsonl). It changes no code, no analysis and no document; the submitted thesis is unchanged. This is how the dated predictions resolve in public."
          git pull --rebase -X theirs origin main
          git push
