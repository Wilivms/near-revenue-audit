name: daily refresh
# Re-fetches the public sources, recomputes every offline step and commits the result as
# dashboard/live.json. The dashboard reads that file from GitHub, so it updates without a redeploy.
# Raw snapshots and dashboard/data.json stay frozen: they back REPORT.md, and `make check-clean`
# rebuilds data.json byte for byte from them.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Fetch fresh public data and recompute
        run: make refresh
      - name: Commit the live bundle only
        run: |
          cp dashboard/data.json dashboard/live.json
          git checkout -- data dashboard/data.json
          git clean -fdq data
          git config user.name "near-revenue-audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/live.json
          git diff --cached --quiet || git commit -m "Daily refresh of the live dashboard bundle ($(date -u +%F))"
          git pull --rebase -X theirs origin main
          git push
